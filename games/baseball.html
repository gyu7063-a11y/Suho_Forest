<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1626">
<title>나만의 프로야구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c1626; --card: #15253c; --card2: #1c3150; --line: #2c4a70; --acc: #ffd24a; --good: #5fe08a; --bad: #ff6a6a; --sub: #9fb3cc; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(ellipse at 50% 0%, #1d3558, #0c1626 60%) fixed; color: #fff; font-family: 'Jua', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
  #app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .scr { display: none; flex: 1; flex-direction: column; padding: 10px 12px 14px; gap: 10px; }
  .scr.on { display: flex; }
  button { font-family: inherit; color: #fff; cursor: pointer; border: none; }
  a.btn { color: #fff; }
  .btn { background: linear-gradient(180deg, #2f5684, #213e63); border: 1px solid #4a74a8; border-radius: 14px; padding: 11px 12px; font-size: 17px; box-shadow: 0 3px 0 #0a1830; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0a1830; }
  .btn.go { background: linear-gradient(180deg, #ffd24a, #f0a820); color: #3a2400; border-color: #ffe48a; box-shadow: 0 3px 0 #8a5a00; }
  .btn.red { background: linear-gradient(180deg, #e8505a, #b8323c); border-color: #ff8a90; }
  .btn.ghost { background: rgba(255,255,255,.06); border-color: #ffffff30; box-shadow: none; }
  .btn:disabled { opacity: .4; }
  .card { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .sub { color: var(--sub); font-size: 13px; }
  h1 { margin: 6px 0 0; font-weight: 400; font-size: 34px; text-align: center; color: var(--acc); text-shadow: 0 3px 0 #6a4a00, 0 0 20px #ffd24a55; }
  h2 { margin: 0; font-weight: 400; font-size: 21px; }
  h3 { margin: 0 0 6px; font-weight: 400; font-size: 17px; color: var(--acc); }
  .top { display: flex; align-items: center; gap: 8px; }
  .top .sp { flex: 1; }
  .back { font-size: 15px; padding: 7px 11px; }
  /* title */
  .slot { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 10px; }
  .slot canvas { width: 64px; height: 64px; flex: none; }
  .slot .nm { font-size: 19px; } .slot .ds { font-size: 13px; color: var(--sub); }
  .slot .del { margin-left: auto; font-size: 13px; padding: 6px 9px; }
  /* create */
  .pick { padding: 12px 8px; border-radius: 14px; border: 2px solid #ffffff22; background: rgba(255,255,255,.05); text-align: center; font-size: 15px; }
  .pick.on { border-color: var(--acc); background: rgba(255,210,74,.14); }
  .pick .ic { font-size: 30px; } .pick small { display: block; color: var(--sub); font-size: 12px; margin-top: 2px; }
  input[type=text], input[type=number] { font-family: inherit; font-size: 18px; background: #0a1424; color: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 7px 10px; border-radius: 999px; border: 2px solid #ffffff22; background: rgba(255,255,255,.05); font-size: 14px; }
  .chip.on { border-color: var(--acc); background: rgba(255,210,74,.16); }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #ffffff33; }
  .sw.on { border-color: var(--acc); }
  /* home */
  .pcard { display: flex; gap: 12px; align-items: center; }
  .pcard canvas { width: 110px; height: 130px; flex: none; }
  .ovr { font-size: 42px; color: var(--acc); line-height: 1; }
  .gr { display: inline-block; min-width: 26px; text-align: center; border-radius: 7px; padding: 1px 5px; font-size: 14px; }
  .gS { background: #ff4a8a; } .gA { background: #ff8a2a; } .gB { background: #e8c020; color: #332800; } .gC { background: #4ab86a; } .gD { background: #3a8ad8; } .gE { background: #6a7a8a; }
  .stat { display: grid; grid-template-columns: 64px 30px 1fr 30px; gap: 6px; align-items: center; font-size: 14px; margin: 3px 0; }
  .bar { height: 10px; border-radius: 6px; background: #0a1424; overflow: hidden; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
  .bar b { position: absolute; left: 0; bottom: 0; height: 3px; background: #ffffffaa; }
  .meter { height: 12px; border-radius: 7px; background: #0a1424; overflow: hidden; } .meter i { display: block; height: 100%; border-radius: 7px; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; } .badge { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: #ffd24a22; border: 1px solid #ffd24a66; color: #ffe8a0; }
  .big { font-size: 20px; padding: 14px; }
  .lg { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 13px; }
  /* list rows */
  .li { display: flex; align-items: center; gap: 8px; padding: 9px 4px; border-bottom: 1px solid #ffffff12; font-size: 15px; }
  .li:last-child { border-bottom: none; }
  .li .r { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 5px 4px; text-align: center; border-bottom: 1px solid #ffffff12; font-weight: 400; }
  th { color: var(--sub); font-size: 12px; }
  tr.me td { color: var(--acc); }
  /* game */
  #sGame { padding: 6px 8px 10px; gap: 6px; }
  .sb { display: flex; align-items: center; gap: 8px; background: #08111e; border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px; }
  .sb .tm { display: flex; flex-direction: column; font-size: 15px; line-height: 1.25; }
  .sb .tm span b { display: inline-block; min-width: 26px; text-align: right; color: var(--acc); font-weight: 400; font-size: 18px; }
  .sb .inn { font-size: 15px; text-align: center; min-width: 44px; }
  .sb .bso { font-size: 12px; line-height: 1.35; } .sb .bso i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #2a3a4e; margin-left: 2px; }
  .sb .bso .b.on { background: #4ae06a; } .sb .bso .s.on { background: #ffd24a; } .sb .bso .o.on { background: #ff5a5a; }
  .dia { width: 44px; height: 38px; position: relative; } .dia i { position: absolute; width: 13px; height: 13px; transform: rotate(45deg); background: #2a3a4e; border: 1px solid #5a6a7e; }
  .dia i.on { background: #ffd24a; }
  #cv { width: 100%; aspect-ratio: 360 / 440; border-radius: 14px; background: #000; display: block; touch-action: none; }
  #log { font-size: 14px; min-height: 22px; color: #dfe8f2; text-align: center; }
  #panel { display: flex; flex-direction: column; gap: 6px; min-height: 108px; }
  .pbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .pt { flex: 1; min-width: 60px; padding: 8px 4px; font-size: 14px; border-radius: 12px; background: rgba(255,255,255,.07); border: 2px solid #ffffff22; }
  .pt.on { border-color: var(--acc); background: rgba(255,210,74,.18); }
  .pt small { display: block; font-size: 11px; color: var(--sub); }
  .gauge { position: relative; height: 34px; border-radius: 10px; background: linear-gradient(90deg, #ff5a5a 0%, #ffd24a 30%, #5fe08a 44%, #5fe08a 56%, #ffd24a 70%, #ff5a5a 100%); border: 2px solid #ffffff55; }
  .gauge i { position: absolute; top: -4px; bottom: -4px; width: 5px; margin-left: -2px; background: #fff; border-radius: 3px; box-shadow: 0 0 6px #000; }
  .swing { font-size: 24px; padding: 16px; }
  /* overlay */
  #ov { position: fixed; inset: 0; background: rgba(4,10,20,.78); display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  #ov.on { display: flex; }
  #ov .card { width: 100%; max-width: 420px; text-align: center; max-height: 90vh; overflow-y: auto; }
  .res { font-size: 34px; color: var(--acc); }
  .toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(0,0,0,.82); border: 1px solid var(--acc); border-radius: 14px; padding: 10px 18px; font-size: 18px; z-index: 40; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .toast.on { opacity: 1; }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .hint { font-size: 12px; color: var(--sub); text-align: center; }
</style>
</head>
<body>
<div id="app">
  <!-- TITLE -->
  <section class="scr on" id="sTitle">
    <div class="top"><a href="../index.html" class="btn ghost back" style="text-decoration:none">🏠 게임 목록</a></div>
    <h1>⚾ 나만의 프로야구</h1>
    <div class="sub" style="text-align:center;margin-top:-4px">나만의 투수 · 타자를 만들어 2군에서 레전드까지!</div>
    <div id="slots" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>
    <div class="hint" style="margin-top:auto">선수는 최대 3명까지 저장돼요 · 진행 상황은 이 기기에 자동 저장</div>
  </section>

  <!-- CREATE -->
  <section class="scr" id="sCreate">
    <div class="top"><button class="btn ghost back" id="cBack">← 취소</button><div class="sp"></div><h2>새 선수 만들기</h2></div>
    <div class="card" style="display:flex;gap:12px;align-items:center">
      <canvas id="cPrev" width="220" height="260" style="width:110px;height:130px"></canvas>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <input type="text" id="cName" maxlength="6" placeholder="이름 (최대 6자)">
        <div class="row"><span class="sub" style="width:44px">등번호</span><input type="number" id="cNum" min="0" max="99" value="7" style="width:80px"></div>
      </div>
    </div>
    <div class="grid2" id="cRole"></div>
    <div class="card"><h3>유형</h3><div class="grid3" id="cType"></div></div>
    <div class="card"><h3>손</h3><div class="chips" id="cHand"></div>
      <h3 style="margin-top:10px">소속 팀</h3><div class="chips" id="cTeam"></div>
      <h3 style="margin-top:10px">피부 톤</h3><div class="row" id="cSkin"></div></div>
    <button class="btn go big" id="cMake">⚾ 입단하기</button>
  </section>

  <!-- HOME -->
  <section class="scr" id="sHome">
    <div class="top"><button class="btn ghost back" id="hMenu">☰ 선수 목록</button><div class="sp"></div><span class="sub" id="hSeason"></span></div>
    <div class="card pcard"><canvas id="hAv" width="220" height="260"></canvas>
      <div style="flex:1;min-width:0">
        <div class="row"><h2 id="hName" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></h2></div>
        <div class="sub" id="hTeam"></div>
        <div class="row" style="margin-top:6px;align-items:flex-end;gap:10px"><div class="ovr" id="hOvr"></div><div><div class="sub">종합</div><span class="gr" id="hGr"></span></div><div style="margin-left:auto;text-align:right"><div class="sub">컨디션</div><div id="hCond" style="font-size:22px"></div></div></div>
        <div class="sub" style="margin-top:6px">체력 <span id="hEnT"></span></div><div class="meter"><i id="hEn"></i></div>
      </div>
    </div>
    <div class="card"><div id="hStats"></div><div class="badges" id="hBadges"></div></div>
    <div class="card" id="hToday"></div>
    <button class="btn go big" id="hPlay">⚾ 경기 출전</button>
    <div class="grid2">
      <button class="btn" id="hTrain">💪 훈련</button>
      <button class="btn" id="hGrow">📈 성장 <span id="hSP"></span></button>
      <button class="btn" id="hRest">😴 휴식 (경기 쉬기)</button>
      <button class="btn" id="hRec">📊 기록 · 순위</button>
    </div>
  </section>

  <!-- TRAIN -->
  <section class="scr" id="sTrain">
    <div class="top"><button class="btn ghost back" data-go="sHome">← 돌아가기</button><div class="sp"></div><h2>💪 훈련</h2></div>
    <div class="card"><div class="sub">훈련 1회에 체력 20 · 게이지를 가운데(초록)에서 멈출수록 효과가 커요</div><div class="sub" style="margin-top:4px">현재 체력 <b id="tEn" style="color:var(--acc);font-weight:400"></b></div></div>
    <div class="card" id="tList"></div>
  </section>

  <!-- GROW -->
  <section class="scr" id="sGrow">
    <div class="top"><button class="btn ghost back" data-go="sHome">← 돌아가기</button><div class="sp"></div><h2>📈 성장</h2></div>
    <div class="card"><div class="row"><span>성장 포인트</span><span class="r" style="margin-left:auto;font-size:22px;color:var(--acc)" id="gSP"></span></div><div class="sub">경기에서 활약하면 포인트를 얻어요. 능력치가 높을수록 비싸져요.</div></div>
    <div class="card" id="gList"></div>
    <div class="card" id="gPitch"></div>
    <div class="card" id="gAbil"></div>
  </section>

  <!-- RECORD -->
  <section class="scr" id="sRec">
    <div class="top"><button class="btn ghost back" data-go="sHome">← 돌아가기</button><div class="sp"></div><h2>📊 기록 · 순위</h2></div>
    <div class="card" id="rSeason"></div>
    <div class="card" id="rStand"></div>
    <div class="card" id="rCareer"></div>
  </section>

  <!-- GAME -->
  <section class="scr" id="sGame">
    <div class="sb">
      <div class="tm"><span id="sbA"></span><span id="sbH"></span></div>
      <div class="inn" id="sbInn"></div>
      <div class="dia"><i id="b2" style="left:15px;top:2px"></i><i id="b3" style="left:3px;top:14px"></i><i id="b1" style="left:27px;top:14px"></i></div>
      <div class="bso"><div>B <i class="b"></i><i class="b"></i><i class="b"></i></div><div>S <i class="s"></i><i class="s"></i></div><div>O <i class="o"></i><i class="o"></i></div></div>
      <div style="flex:1"></div>
      <button class="btn ghost" id="gFast" style="font-size:13px;padding:6px 8px">⏩</button>
    </div>
    <canvas id="cv" width="720" height="880"></canvas>
    <div id="log"></div>
    <div id="panel"></div>
  </section>
</div>
<div id="ov"><div class="card" id="ovc"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const R = Math.random, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(R() * a.length)];
const gauss = () => (R() + R() + R() - 1.5) / 1.5;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ================== DATA ==================
const TEAMS = [
  { id: 'rangers', name: '숲 레인저스', c1: '#2f8a4a', c2: '#e8f5e0' },
  { id: 'dolphins', name: '바다 돌핀스', c1: '#2a6ad0', c2: '#e6f0ff' },
  { id: 'phoenix', name: '불꽃 피닉스', c1: '#d8342f', c2: '#fff0e0' },
  { id: 'titans', name: '강철 타이탄스', c1: '#4a5560', c2: '#e8ecf0' },
  { id: 'stars', name: '별빛 스타즈', c1: '#1a2a5a', c2: '#ffd24a' },
  { id: 'thunders', name: '번개 썬더스', c1: '#6a3ac0', c2: '#ffe24a' },
];
const SKINS = ['#f6d2b0', '#e4b088', '#b07a50'];
const BSTAT = [['pow', '파워'], ['con', '컨택'], ['eye', '선구안'], ['spd', '주력'], ['def', '수비']];
const PSTAT = [['vel', '구속'], ['ctl', '제구'], ['brk', '변화구'], ['sta', '체력']];
const PITCHES = {
  FB: { name: '직구', sp: 1, col: '#ffffff' }, SL: { name: '슬라이더', sp: .88, col: '#8fd8ff' }, CB: { name: '커브', sp: .79, col: '#c8a0ff' },
  CH: { name: '체인지업', sp: .83, col: '#9fffb0' }, FK: { name: '포크', sp: .87, col: '#ffb07a' },
};
const BTYPES = [{ k: 'power', ic: '💪', n: '거포형', d: '파워 +12', b: { pow: 12 } }, { k: 'contact', ic: '🎯', n: '교타자형', d: '컨택·선구안 +7', b: { con: 7, eye: 6 } }, { k: 'speed', ic: '⚡', n: '준족형', d: '주력·수비 +8', b: { spd: 9, def: 6 } }];
const PTYPES = [{ k: 'fire', ic: '🔥', n: '강속구형', d: '구속 +12', b: { vel: 12 } }, { k: 'control', ic: '🎯', n: '제구형', d: '제구 +12', b: { ctl: 12 } }, { k: 'tech', ic: '🌀', n: '기교파', d: '변화구 +8 · 구종 1개 더', b: { brk: 8 } }];
const SUR = '김이박최정강조윤장임한오서신권황안송류홍전고문양손배백허유남심노하곽성차주우구민진나'.split('');
const GIV = '민준서준도윤시우주원하준지호지훈준서건우현우우진선우연우유준정우승현승우지환승민시윤준혁은찬수호동현재원태윤민재성민'.match(/../g);
const genName = () => pick(SUR) + pick(GIV);
const ABILS = {
  bat: [['pow', 80, '💪 파워히터', '타구 속도 +6'], ['con', 80, '🎯 교타자', '타격 커서 크게'], ['eye', 75, '👁️ 선구안', '공 도착 지점 예측이 항상 보임'], ['spd', 80, '⚡ 준족', '내야 안타 · 장타 확률 증가'], ['def', 80, '🧤 명수비', '상대 득점 감소']],
  pit: [['vel', 80, '🔥 강속구', '직구 위력 증가'], ['ctl', 80, '🎯 컨트롤 아티스트', '제구 오차 20% 감소'], ['brk', 80, '🌀 마구', '헛스윙 유도 증가'], ['sta', 80, '🔋 철완', '피로가 늦게 쌓임']],
};
const hasAb = (p, k) => (p.role === 'bat' ? ABILS.bat : ABILS.pit).some(([s, v]) => s === k && p.st[s] >= v);
const grade = v => v >= 90 ? 'S' : v >= 80 ? 'A' : v >= 70 ? 'B' : v >= 60 ? 'C' : v >= 50 ? 'D' : 'E';
const grSpan = v => `<span class="gr g${grade(v)}">${grade(v)}</span>`;
const statCol = v => v >= 90 ? '#ff4a8a' : v >= 80 ? '#ff8a2a' : v >= 70 ? '#e8c020' : v >= 60 ? '#4ab86a' : v >= 50 ? '#3a8ad8' : '#6a7a8a';
const ovr = p => p.role === 'bat'
  ? Math.round((p.st.pow * 1.15 + p.st.con * 1.2 + p.st.eye * .8 + p.st.spd * .7 + p.st.def * .6) / 4.45)
  : Math.round((p.st.vel * 1.2 + p.st.ctl * 1.2 + p.st.brk * 1 + p.st.sta * .6) / 4 + Object.keys(p.pitches).length * 1.2 - 1.2);
const velKmh = v => Math.round(122 + v * .38);
const LEAGUE = ['2군 퓨처스', '1군'];

// ================== SAVE ==================
const KEY = 'mgc.baseball';
let S = { slots: [null, null, null], cur: -1 };
try { const t = JSON.parse(localStorage.getItem(KEY)); if (t && t.slots) S = t; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const P = () => S.slots[S.cur];

// ================== UI HELPERS ==================

function drawPlayer(c, x, y, s, o) {

  c.fillStyle = o.c1; c.fillRect(-20, -26, 15, 5); c.fillRect(5, -26, 15, 5);

  c.fillStyle = o.c1; c.fillRect(-26, -50, 52, 7); // belt
  c.fillStyle = o.c1; c.font = 'bold 22px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';

  c.strokeStyle = o.c1; c.lineWidth = 3; c.beginPath(); c.moveTo(-8, -95); c.lineTo(0, -84); c.lineTo(8, -95); c.stroke();

    const a = lerp(-.5, 2.4, sw); // bat angle

    c.save(); c.translate(20, -86); c.rotate(ang); c.fillStyle = o.c2; rr(c, -6, -2, 12, 34, 6); c.fillStyle = o.skin; circle(c, 0, 36, 7);
    if (arm < .6) { c.fillStyle = '#fff'; circle(c, 0, 42, 5); }
    c.restore();
  } else {
    c.fillStyle = o.c2; limb(c, -20, -86, -30, -52, 11); limb(c, 20, -86, 30, -52, 11);
    c.fillStyle = o.skin; circle(c, -30, -50, 7);
    if (o.role === 'pit') { c.fillStyle = '#7a4a2a'; circle(c, 31, -50, 11); }
    else { c.save(); c.translate(31, -50); c.rotate(.35); c.fillStyle = '#d8a860'; c.beginPath(); c.moveTo(-3, 0); c.lineTo(3, 0); c.lineTo(5, -60); c.quadraticCurveTo(0, -67, -5, -60); c.closePath(); c.fill(); c.stroke(); c.restore(); c.fillStyle = o.skin; circle(c, 30, -50, 7); }

  c.fillStyle = dark; circle(c, -9, -118, 3.4, true); circle(c, 9, -118, 3.4, true);
  c.strokeStyle = dark; c.lineWidth = 2; c.beginPath(); c.arc(0, -110, 7, .2, Math.PI - .2); c.stroke();
  c.fillStyle = 'rgba(255,120,120,.35)'; circle(c, -16, -110, 5, true); circle(c, 16, -110, 5, true);
  // cap
  c.fillStyle = o.c1; c.strokeStyle = dark; c.lineWidth = 2.5;

    sfx.whiff(); s.mark = { col: '#ff6a6a' }; cnt.s++;
    if (cnt.s >= 3) return finish('K', '헛스윙 삼진', '#ff6a6a'); return finish(null, '헛스윙', '#ff9a6a');
  }
  const Q = clamp((1 - d / Rr) * .58 + (1 - Math.abs(tErr) / .16) * .42, 0, 1);
  sfx.hit(); s.hideBall = true;
  if (Math.abs(tErr) > .115 || Q < .2) { if (cnt.s < 2) cnt.s++; return finish(null, '파울', '#ffffff'); }
  // batted ball
  const pow = p.st.pow * condMul(p) * G.fatigue;
  const ev = 92 + (pow * .62 + 22) * Q + gauss() * 6 + (hasAb(p, 'pow') ? 6 : 0);
  const la = 12 + (s.cur.y - pt.fy) / s.curR * 38 + gauss() * 7;
  const hs = p.hand === 'R' ? 1 : -1;
  const spray = clamp(tErr / .115 * 38 * hs + gauss() * 8, -44, 44);
  if (Math.abs(spray) > 43.5 && R() < .5) { if (cnt.s < 2) cnt.s++; return finish(null, '파울', '#fff'); }

  s.big = null;
  setTimeout(() => fieldAnim(res).then(() => { s.mode = 'idle'; $('panel').innerHTML = ''; const r = batResolve; batResolve = null; r(res.o); }), 350);
}
function battedResult(ev, la, spray, spd) {
  const v = ev / 3.6, th = clamp(la, -10, 70) * Math.PI / 180;
  let dist = la <= 3 ? 20 + ev * .25 : clamp(v * v * Math.sin(2 * th) / 9.8 * .76, 8, 170);
  const fence = 102 + 20 * Math.cos(spray * Math.PI / 180 * 2);
  let o;
  if (la < 9) { const hp = clamp((ev - 110) / 75, .06, .55) + spd * .002; o = R() < hp ? (ev > 150 && R() < .2 ? '2B' : '1B') : 'GO'; dist = Math.min(dist, la < 3 ? 40 : 60); }
  else if (la < 26) { const hp = clamp(.32 + (ev - 120) / 90, .25, .86); if (R() < hp) { o = dist > 72 && R() < .45 + spd * .002 ? (R() < .06 + spd * .002 ? '3B' : '2B') : '1B'; } else o = la < 15 ? 'GO' : 'FO'; }
  else if (la < 52) { if (dist >= fence) o = 'HR'; else if (dist > fence - 14 && R() < .4) o = R() < .12 + spd * .002 ? '3B' : '2B'; else o = R() < .1 ? '1B' : 'FO'; }
  else { o = 'FO'; dist = Math.min(dist, 40); }
  if (o === 'HR') dist = Math.max(dist, fence + 4);
  return { o, ev, la, spray, dist, fence };
}
function fieldAnim(res) {
  return new Promise(done => {
    const s = scene; s.mode = 'field'; s.ft = 0; s.res = res; s.fdur = Math.max(.9, Math.min(2.2, res.dist / 60)); s.fdone = done;
    if (res.o === 'HR') { sfx.hr(); sfx.cheer(); } else if (['1B', '2B', '3B'].includes(res.o)) sfx.ok();
  });
}
function drawFieldView() {
  const c = cx, s = scene, r = s.res, sc = 2.45, H = { x: 180, y: 428 };
  c.fillStyle = '#123018'; c.fillRect(0, 0, VW, VH);
  // outfield
  c.fillStyle = '#3f9a4a'; c.beginPath(); c.moveTo(H.x, H.y);
  for (let a = -45; a <= 45; a += 3) { const f = 102 + 20 * Math.cos(a * Math.PI / 180 * 2), rr = f * sc, aa = (a - 90) * Math.PI / 180; c.lineTo(H.x + Math.cos(aa) * rr, H.y + Math.sin(aa) * rr); }
  c.closePath(); c.fill();
  c.strokeStyle = '#ffd24a'; c.lineWidth = 3; c.beginPath();
  for (let a = -45; a <= 45; a += 3) { const f = 102 + 20 * Math.cos(a * Math.PI / 180 * 2), rr = f * sc, aa = (a - 90) * Math.PI / 180; c[a === -45 ? 'moveTo' : 'lineTo'](H.x + Math.cos(aa) * rr, H.y + Math.sin(aa) * rr); } c.stroke();
  // infield
  const bd = 27.4 * sc;
  c.fillStyle = '#b8865a'; c.beginPath(); c.moveTo(H.x, H.y + 8); c.lineTo(H.x + bd * .85, H.y - bd * .7); c.lineTo(H.x, H.y - bd * 1.55); c.lineTo(H.x - bd * .85, H.y - bd * .7); c.closePath(); c.fill();
  c.fillStyle = '#3f9a4a'; c.beginPath(); c.moveTo(H.x, H.y - 12); c.lineTo(H.x + bd * .6, H.y - bd * .7); c.lineTo(H.x, H.y - bd * 1.3); c.lineTo(H.x - bd * .6, H.y - bd * .7); c.closePath(); c.fill();
  c.strokeStyle = '#ffffffaa'; c.lineWidth = 2; c.beginPath(); c.moveTo(H.x, H.y); c.lineTo(H.x - 300 * .707, H.y - 300 * .707); c.moveTo(H.x, H.y); c.lineTo(H.x + 300 * .707, H.y - 300 * .707); c.stroke();
  const bases = [[H.x + bd * .707, H.y - bd * .707], [H.x, H.y - bd * 1.414], [H.x - bd * .707, H.y - bd * .707]];
  bases.forEach(([x, y], i) => { c.fillStyle = G && G.bases[i] ? '#ffd24a' : '#fff'; c.save(); c.translate(x, y); c.rotate(Math.PI / 4); c.fillRect(-5, -5, 10, 10); c.restore(); });
  c.fillStyle = '#fff'; c.beginPath(); c.arc(H.x, H.y, 5, 0, 7); c.fill();
  // fielders
  c.fillStyle = '#e8e8f0';
  for (const [a, d] of [[-30, 85], [0, 95], [30, 85], [-22, 40], [-8, 46], [8, 46], [22, 40], [0, 18]]) { const aa = (a - 90) * Math.PI / 180; c.beginPath(); c.arc(H.x + Math.cos(aa) * d * sc, H.y + Math.sin(aa) * d * sc, 4, 0, 7); c.fill(); }
  // ball
  const t = Math.min(1, s.ft), aa = (r.spray - 90) * Math.PI / 180, dd = r.dist * sc * t;
  const bx = H.x + Math.cos(aa) * dd, by = H.y + Math.sin(aa) * dd;
  const hgt = r.la > 9 ? Math.sin(t * Math.PI) * Math.min(80, r.dist * .5 * Math.sin(r.la * Math.PI / 180) + 10) : 0;
  c.strokeStyle = '#ffffff66'; c.lineWidth = 1.5; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(H.x, H.y); c.lineTo(bx, by); c.stroke(); c.setLineDash([]);
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(bx, by, 5, 2.5, 0, 0, 7); c.fill();
  drawBall(bx, by - hgt, 5 + hgt / 25);
  // labels
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '14px Jua, sans-serif'; c.fillStyle = '#fff';
  c.fillText(`타구 속도 ${Math.round(r.ev)}km · 발사각 ${Math.round(r.la)}° · 비거리 ${Math.round(r.dist)}m`, 180, 20);
  if (s.ft > .95) {
    const txt = { HR: '🎆 홈런!!', '3B': '3루타!', '2B': '2루타!', '1B': '안타!', GO: '땅볼 아웃', FO: '뜬공 아웃' }[r.o];
    const good = !['GO', 'FO'].includes(r.o);
    c.font = (r.o === 'HR' ? 48 : 38) + 'px Jua, sans-serif'; c.lineWidth = 7; c.strokeStyle = '#000'; c.strokeText(txt, 180, 120); c.fillStyle = good ? (r.o === 'HR' ? '#ffd24a' : '#5fe08a') : '#ff8a8a'; c.fillText(txt, 180, 120);
    if (r.o === 'HR') for (let i = 0; i < 26; i++) { const a = i / 26 * 6.28 + s.ft * 2, rd = 40 + (s.ft - .95) * 160; c.fillStyle = ['#ffd24a', '#ff6a8a', '#6ac8ff', '#8aff8a'][i % 4]; c.beginPath(); c.arc(180 + Math.cos(a) * rd, 140 + Math.sin(a) * rd * .7, 3, 0, 7); c.fill(); }
  }
}

// ---------- pitching ----------
let pitResolve = null, myPitch = 'FB';
function userPitch(batter) {
  return new Promise(res => {
    pitResolve = res;
    const s = scene; s.mode = 'pit'; s.batter = batter; s.target = s.target || { x: Z.x + Z.w / 2, y: Z.y + Z.h / 2 }; s.pt = null; s.big = null;
    G.count = { b: 0, s: 0 }; renderSB();
    log(`⚾ 상대 타자 <b>${batter.name}</b> (${batter.hand === 'R' ? '우타' : '좌타'})`);
    aimPanel();
  });
}
function aimPanel() {
  const p = G.p, s = scene; s.st = 'aim'; s.ghost = null; s.pitchLabel = null; s.swingAnim = null;
  if (!p.pitches[myPitch]) myPitch = 'FB';
  $('panel').innerHTML = `<div class="pbtns">${Object.keys(p.pitches).map(k => `<button class="pt${k === myPitch ? ' on' : ''}" data-pt="${k}">${PITCHES[k].name}<small>${k === 'FB' ? velKmh(p.st.vel) + 'km' : 'Lv' + p.pitches[k]}</small></button>`).join('')}</div>
    <div class="row"><button class="btn go" id="thBtn" style="flex:2;font-size:20px">⚾ 던지기</button><button class="btn ghost" id="autoBtn" style="flex:1;font-size:13px">이 타자 자동</button><button class="btn ghost" id="pullBtn" style="flex:1;font-size:13px">교체</button></div>
    <div class="hint">화면을 눌러 던질 곳을 정하고 → 던지기 → 게이지를 가운데에서 멈추면 정확하게 들어가요</div>`;
  $('panel').querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { myPitch = b.dataset.pt; aimPanel(); });
  $('thBtn').onclick = gaugePanel;
  $('autoBtn').onclick = autoPA;
  $('pullBtn').onclick = async () => { if (await overlay('<h3>마운드에서 내려갈까요?</h3><div class="sub">남은 이닝은 불펜이 던져요</div>', [['계속 던지기', 'ghost'], ['교체', 'red']]) === 1) { G.pc = Math.max(G.pc, G.stam); autoPA(); } };
}
function gaugePanel() {
  const s = scene; s.st = 'gauge'; s.t = 0; s.gsp = 3.4 + (myPitch === 'FB' ? .4 : 0) + G.pc / G.stam * 1.5;
  $('panel').innerHTML = `<div class="gauge" style="margin:4px 0"><i id="pgN"></i></div><button class="btn go swing" id="stBtn">STOP!</button>`;
  $('stBtn').onpointerdown = e => { e.preventDefault(); throwIt(1 - Math.abs(s.gpos - .5) * 2); };
}
function fatigueK() { const r = G.pc / G.stam; return r < .75 ? 1 : 1 - (r - .75) * .9; }
function pitchPower(p, type) { return type === 'FB' ? p.st.vel * (hasAb(p, 'vel') ? 1.08 : 1) : (p.st.brk * .7 + p.pitches[type] * 7 + 10) * (hasAb(p, 'brk') ? 1.08 : 1); }
function throwIt(acc) {
  const p = G.p, s = scene, fk = fatigueK() * G.fatigue * condMul(p);
  $('panel').innerHTML = `<div class="hint" style="padding:30px 0">${acc > .9 ? '🎯 완벽한 투구!' : acc > .65 ? '좋아요!' : acc > .35 ? '조금 빗나갈 수도…' : '😱 실투!'}</div>`;
  const sc = (3 + (100 - p.st.ctl * fk) * .2) * (1.65 - acc * 1.1) * (hasAb(p, 'ctl') ? .8 : 1);
  const fx = s.target.x + gauss() * sc, fy = s.target.y + gauss() * sc;
  const kmh = Math.round(velKmh(p.st.vel * Math.min(1, fk + .05)) * PITCHES[myPitch].sp * (.95 + acc * .05));
  s.acc = acc;
  setupPitch({ type: myPitch, hand: p.hand, fx, fy, kmh, bm: .55 + (p.st.brk / 100) * .5 + p.pitches[myPitch] * .06, rx: REL.x + (p.hand === 'R' ? -10 : 10) });
  s.wind = .45; s.pitchLabel = `${kmh}km ${PITCHES[myPitch].name}`;
  G.pc++;
}
function aiSwingDecide() {
  const s = scene, b = s.batter, pt = s.pt, cnt = G.count, p = G.p;
  const zin = inZone(pt.fx, pt.fy), edge = edgeOf(pt.fx, pt.fy), pw = pitchPower(p, pt.type) * fatigueK(), dec = pt.type === 'FB' ? (pw - 50) / 200 : (pw - 30) / 110;
  const mid = zin ? 1 - edge : 0;
  let sw = zin ? .62 + mid * .2 + (cnt.s === 2 ? .15 : 0) - (cnt.b === 3 && cnt.s < 2 ? .25 : 0) : clamp(.24 + dec * .45 - (b.eye - 50) * .006 + (cnt.s === 2 ? .16 : 0) - Math.max(0, Math.hypot(pt.fx - (Z.x + Z.w / 2), pt.fy - (Z.y + Z.h / 2)) - 70) * .01, .03, .62);
  s.aiSwing = R() < sw;
  if (s.aiSwing) s.swingAnim = 0;
}
function resolvePitPitch() {
  const s = scene, b = s.batter, pt = s.pt, cnt = G.count, p = G.p;
  const zin = inZone(pt.fx, pt.fy), edge = edgeOf(pt.fx, pt.fy), pw = pitchPower(p, pt.type) * fatigueK() * condMul(p);
  s.st = 'done';
  const fin = (o, big, col) => { s.big = big; s.bigCol = col; s.flash = .9; renderSB(); setTimeout(() => { if (o) { s.mode = 'idle'; $('panel').innerHTML = ''; const r = pitResolve; pitResolve = null; r(o); } else aimPanel(); }, 950); };
  if (!s.aiSwing) {
    sfx.mitt(); s.mark = { col: zin ? '#ffd24a' : '#5fe08a' };
    if (zin) { cnt.s++; if (cnt.s >= 3) { sfx.ok(); return fin('K', '루킹 삼진!', '#ffd24a'); } return fin(null, '스트라이크!', '#ffd24a'); }
    cnt.b++; if (cnt.b >= 4) return fin('BB', '볼넷', '#ff9a6a'); return fin(null, '볼', '#9fe0ff');
  }
  const mid = zin ? 1 - edge : 0;
  const contact = clamp(.74 + (b.con - pw) / 160 - (zin ? 0 : .26) - edge * .1 + mid * .06 - (pt.type !== 'FB' ? (p.pitches[pt.type] || 1) * .02 : 0), .3, .93);
  if (R() > contact) { sfx.whiff(); s.mark = { col: '#ff6a6a' }; cnt.s++; if (cnt.s >= 3) { sfx.ok(); return fin('K', '헛스윙 삼진!', '#ffd24a'); } return fin(null, '헛스윙!', '#ffd24a'); }
  sfx.hit(); s.hideBall = true;
  if (R() < .36 + edge * .12) { if (cnt.s < 2) cnt.s++; return fin(null, '파울', '#fff'); }
  // ball in play: quality from batter vs pitch
  const q = clamp(R() * .9 + (b.pow - pw) / 220 + mid * .18 - (zin ? 0 : .2) - (s.acc > .9 ? .08 : 0), 0, 1.1);
  const ev = 95 + q * (50 + b.pow * .35) + gauss() * 6, la = 6 + R() * 42 + gauss() * 6, spray = clamp(gauss() * 30, -44, 44);
  const res = battedResult(ev, la, spray, 50);
  setTimeout(() => fieldAnim(res).then(() => { s.mode = 'idle'; $('panel').innerHTML = ''; const r = pitResolve; pitResolve = null; r(res.o); }), 350);
}
function autoPA() {
  const p = G.p, s = scene, b = s.batter;
  const pstr = (p.st.vel + p.st.ctl + p.st.brk) / 3 * fatigueK() + Object.keys(p.pitches).length;
  const o = simPA((b.con + b.pow) / 2, pstr);
  G.pc += 3 + Math.floor(R() * 3);
  s.mode = 'idle'; $('panel').innerHTML = '';
  const r = pitResolve; pitResolve = null; r(o);
}

// ---------- input ----------
let touchOff = 0;
cv.addEventListener('pointerdown', ev => {
  const v = toV(ev), s = scene;
  if (s.mode === 'bat') { touchOff = ev.pointerType === 'mouse' ? 0 : 60; if (ev.pointerType === 'mouse') { moveCur(v); doSwing(); } else moveCur({ x: v.x, y: v.y - touchOff }); }
  if (s.mode === 'pit' && s.st === 'aim') { s.target = { x: clamp(v.x, Z.x - 46, Z.x + Z.w + 46), y: clamp(v.y, Z.y - 46, Z.y + Z.h + 46) }; }
  ev.preventDefault();
});
cv.addEventListener('pointermove', ev => {
  const v = toV(ev), s = scene;
  if (s.mode === 'bat') moveCur({ x: v.x, y: v.y - (ev.pointerType === 'mouse' ? 0 : touchOff) });
  if (s.mode === 'pit' && s.st === 'aim' && ev.buttons) s.target = { x: clamp(v.x, Z.x - 46, Z.x + Z.w + 46), y: clamp(v.y, Z.y - 46, Z.y + Z.h + 46) };
});
function moveCur(v) { scene.cur = { x: clamp(v.x, Z.x - 40, Z.x + Z.w + 40), y: clamp(v.y, Z.y - 40, Z.y + Z.h + 40) }; }
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); if (scene.mode === 'bat') doSwing(); else if (scene.mode === 'pit' && scene.st === 'gauge') throwIt(1 - Math.abs(scene.gpos - .5) * 2); else if (scene.mode === 'pit' && scene.st === 'aim') gaugePanel(); }
});

// boot
window.__bb = { S, P, G: () => G, scene, battedResult, simPA };
renderTitle();
if (S.cur >= 0 && S.slots[S.cur]) { /* stay on title to choose */ }
})();
</script>
