<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미니게임천국">
<meta name="theme-color" content="#1a1238">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>나만의 미니게임천국</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(ellipse at 50% -10%, #4a2a8a, #1a1238 55%, #0e0a20) fixed; color: #fff; font-family: 'Jua', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; user-select: none; -webkit-user-select: none; }
  #app { max-width: 860px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { margin: 6px 0 2px; text-align: center; font-weight: 400; font-size: 36px; color: #ffd75a; text-shadow: 0 3px 0 #7a4a00, 0 0 24px #ffd75a66; }
  .sub { text-align: center; color: #c8b8f0; font-size: 15px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .game { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #fff; border-radius: 22px; padding: 16px; position: relative; overflow: hidden; border: 2px solid #ffffff22; box-shadow: 0 6px 0 #00000055; transition: transform .12s; }
  .game:active { transform: translateY(3px); box-shadow: 0 3px 0 #00000055; }
  @media (hover: hover) { .game:hover { transform: translateY(-4px); } }
  .game .ic { font-size: 54px; line-height: 1.1; filter: drop-shadow(0 4px 8px #0006); }
  .game .nm { font-size: 24px; }
  .game .ds { font-size: 14px; opacity: .85; line-height: 1.45; }
  .game .rec { margin-top: auto; font-size: 13px; background: #00000040; border-radius: 10px; padding: 6px 10px; }
  .game .tag { position: absolute; right: 12px; top: 12px; font-size: 12px; background: #ffffff26; border-radius: 999px; padding: 3px 9px; }
  .forest { background: linear-gradient(160deg, #2f7a3e, #14381e); }
  .baseball { background: linear-gradient(160deg, #2a5ab8, #122648); }
  .soon { background: repeating-linear-gradient(135deg, #ffffff08 0 12px, #ffffff03 12px 24px); border-style: dashed; justify-content: center; align-items: center; text-align: center; min-height: 190px; color: #c8b8f0; box-shadow: none; }
  .foot { text-align: center; color: #8a7ab8; font-size: 12px; margin-top: 22px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <h1>🎮 나만의 미니게임천국</h1>
  <div class="sub">그때그때 하고 싶은 게임을 골라서 플레이!</div>
  <div class="grid" id="grid"></div>
  <div class="foot">홈 화면에 추가하면 앱처럼 실행되고, 한 번 연 게임은 인터넷 없이도 할 수 있어요<br>기록은 이 기기에 저장돼요</div>
</div>
<script>
const GAMES = [
  { id: 'suho', href: 'games/suho.html', cls: 'forest', ic: '🌲', name: '수호의 숲 3D', ds: '3D 타워 디펜스 · 타워를 세우고 강화해서 몬스터 웨이브를 막아요. 웨이브 80 최종 보스 · 익스트림 모드', tag: '디펜스',
    rec: () => { const b = +localStorage.getItem('forestTD.best') || 0; return b ? `🏆 최고 기록: 웨이브 ${b}` : '아직 기록 없음'; } },
  { id: 'baseball', href: 'games/baseball.html', cls: 'baseball', ic: '⚾', name: '나만의 프로야구', ds: '나만의 투수(선발·중계·마무리)·타자를 3D 구장에서 키워요. 견제·도루까지!', tag: '육성 · 스포츠',
    rec: () => { try { const s = JSON.parse(localStorage.getItem('mgc.baseball')); const ps = (s && s.slots || []).filter(Boolean); if (!ps.length) return '아직 선수 없음'; return ps.map(p => `${p.role === 'bat' ? '🏏' : '⚾'} ${p.name} · ${p.season.year}년차 ${p.league ? '1군' : '2군'}`).join('<br>'); } catch (e) { return '아직 선수 없음'; } } },
];
const g = document.getElementById('grid');
let h = '';
for (const x of GAMES) { let r = ''; try { r = x.rec(); } catch (e) {} h += `<a class="game ${x.cls}" href="${x.href}"><span class="tag">${x.tag}</span><div class="ic">${x.ic}</div><div class="nm">${x.name}</div><div class="ds">${x.ds}</div><div class="rec">${r}</div></a>`; }
h += `<div class="game soon"><div style="font-size:40px">＋</div><div>새 게임이 여기에 추가돼요</div></div>`;
g.innerHTML = h;
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
